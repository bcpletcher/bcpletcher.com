name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build, audit)
    runs-on: ubuntu-latest
    env:
      VITE_CACHE_EPOCH: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Coordination, session, and API tests
        working-directory: ./frontend
        run: npm run test:coordination

      - name: Lint (no warnings)
        working-directory: ./frontend
        run: npm run lint -- --max-warnings=0

      - name: Production build
        working-directory: ./frontend
        run: npm run build

      - name: Production dependency audit
        working-directory: ./frontend
        run: npm audit --omit=dev

  functions:
    # Legacy required-check name retained for branch-protection compatibility;
    # this job validates only the Cloudflare Worker and does not use Firebase.
    name: Firebase Functions (lint, audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      - name: Install Cloudflare Worker dependencies
        working-directory: ./cloudflare/worker
        run: npm ci

      - name: Worker tests
        working-directory: ./cloudflare/worker
        run: npm test

      - name: Wrangler deploy dry-run
        working-directory: ./cloudflare/worker
        run: npx wrangler deploy --dry-run --config wrangler.toml

      - name: Production dependency audit
        working-directory: ./cloudflare/worker
        run: npm audit --omit=dev
